[package]
name = "marea-desktop"
version = "0.2.3"
description = "Marea para Mac y Windows"
authors = ["Paperclip"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/mareabypaperclip/marea-desktop"
edition = "2021"
rust-version = "1.77"

[lib]
name = "marea_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2.8"
tauri-plugin-opener = "2.7"
tauri-plugin-single-instance = "2.5"
tauri-plugin-window-state = "2.5"
tauri-plugin-store = "2.5"
tauri-plugin-dialog = "2.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
sys-locale = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["time", "sync"] }
tauri-plugin-autostart = "2"

[target.'cfg(target_os = "macos")'.dependencies]
# Core Location (your position, for the weather): plain Objective-C messages, see location.rs
objc2 = "0.6"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
