# Release: pushing a "vX.Y.Z" tag (or running it by hand from the Actions tab) builds the installers on GitHub's
# machines (universal macOS, Windows and Linux) and publishes them together under Releases. The release starts as
# a draft and is only published when all three systems succeed.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.result }}
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: version
        run: echo "version=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"
      - name: Draft release
        id: create
        uses: actions/github-script@v7
        env:
          VERSION: ${{ steps.version.outputs.version }}
        with:
          script: |
            const version = process.env.VERSION;
            const tag = `v${version}`;
            const { owner, repo } = context.repo;
            const { data: releases } = await github.rest.repos.listReleases({ owner, repo, per_page: 50 });
            const found = releases.find((r) => r.tag_name === tag);
            if (found) {
              if (!found.draft) core.setFailed(`${tag} is already published: bump the version number.`);
              return found.id;
            }
            const body = [
              `Marea for desktop ${version}.`,
              '',
              '**Downloads**',
              '- **macOS** 11 or later (Apple Silicon and Intel): `Marea_' + version + '_universal.dmg`',
              '- **Windows** 10 and 11: `Marea_' + version + '_x64-setup.exe`',
              '- **Linux**: `.deb` (Debian, Ubuntu, Mint), `.rpm` (Fedora, openSUSE) or `.AppImage` (any distribution)',
              '',
              '**First launch (unsigned)**',
              '- macOS: if it says Marea can\'t be opened, go to System Settings → Privacy & Security → Open Anyway.',
              '- Windows: if SmartScreen says "Windows protected your PC", choose More info → Run anyway.',
            ].join('\n');
            const { data } = await github.rest.repos.createRelease({
              owner, repo, tag_name: tag, name: `Marea for desktop ${version}`, body, draft: true, prerelease: false,
            });
            return data.id;

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # Intel machine on purpose: GitHub's Apple Silicon runners are often short of capacity, and the
          # universal build compiles both architectures anyway.
          - platform: macos-15-intel
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - name: Linux libraries for Tauri
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - name: Build and upload the installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

  publish:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            const { owner, repo } = context.repo;
            await github.rest.repos.updateRelease({ owner, repo, release_id: Number(process.env.RELEASE_ID), draft: false });
